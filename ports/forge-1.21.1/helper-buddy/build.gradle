plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
}

// mod_id, mod_name, mod_version, ... are the shared project's (one version number for every loader)
def sharedProps = new Properties()
file("../../../${shared_dir}/gradle.properties").withInputStream { sharedProps.load(it) }
['mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_group_id', 'mod_authors', 'mod_description'].each { k ->
    project.ext.set(k, sharedProps.getProperty(k))
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// The mod's code is shared with the other loaders (../../../<shared_dir>). ../../pp.py makes this target's copy of it
// (conditional blocks, 1.21 data folders), with this project's own src/main laid over it.
def sharedMain = file("../../../${shared_dir}/src/main")
def ppOut = layout.buildDirectory.dir('pp').get().asFile
def ppScript = file('../../pp.py')
def preprocess = tasks.register('preprocess', Exec) {
    inputs.dir(sharedMain)
    inputs.dir(file('src/main'))
    inputs.file(ppScript)
    outputs.dir(ppOut)
    commandLine 'python3', ppScript.absolutePath, '--src', sharedMain.absolutePath, '--overlay', file('src/main').absolutePath,
            '--out', ppOut.absolutePath, '--flags', pp_flags
}
sourceSets.main.java.srcDirs = [files("${ppOut}/java").builtBy(preprocess)]
sourceSets.main.resources.srcDirs = [files("${ppOut}/resources").builtBy(preprocess)]

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.console.level', 'info'
        }
        register('client') {
            // CI client smoke test: opens the world "smoke" and takes screenshots
            systemProperty 'helperbuddy.clientsmoke', System.getenv('HELPER_CLIENTSMOKE') ?: 'false'
            systemProperty 'helperbuddy.promo', System.getenv('HOLLOW_PROMO') ?: 'false'
            if (System.getenv('HELPER_CLIENTSMOKE')) {
                args '--quickPlaySingleplayer', 'smoke', '--width', System.getenv('MC_WIDTH') ?: '960', '--height', System.getenv('MC_HEIGHT') ?: '540'
            }
        }
        register('server') {
            args '--nogui'
            // CI smoke test: the mod stops the server as soon as it has fully started
            systemProperty 'helperbuddy.smoketest', System.getenv('HELPER_SMOKETEST') ?: 'false'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup('software.bernie.geckolib')
        }
    }
    mavenCentral()
}

configurations {
    bundled
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
    bundled("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description, geckolib_version: geckolib_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// GeckoLib goes inside our jar (Forge's jar-in-jar: META-INF/jarjar + metadata.json), so players only need this mod
def jarjarMeta = layout.buildDirectory.file('jarjar/META-INF/jarjar/metadata.json')
def writeJarJar = tasks.register('writeJarJarMetadata') {
    def gv = geckolib_version
    def mv = minecraft_version
    outputs.file(jarjarMeta)
    doLast {
        def f = jarjarMeta.get().asFile
        f.parentFile.mkdirs()
        f.text = """{"jars":[{"identifier":{"group":"software.bernie.geckolib","artifact":"geckolib-forge-${mv}"},""" +
                """"version":{"range":"[${gv},)","artifactVersion":"${gv}"},""" +
                """"path":"META-INF/jarjar/geckolib-forge-${mv}-${gv}.jar","isObfuscated":false}]}"""
    }
}

tasks.named('jar', Jar).configure {
    dependsOn writeJarJar
    from(layout.buildDirectory.dir('jarjar'))
    from(configurations.bundled) { into 'META-INF/jarjar' }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000'
}
