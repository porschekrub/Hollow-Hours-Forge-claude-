plugins {
    id 'fabric-loom' version '1.17.21'
}
repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}
dependencies {
    minecraft "com.mojang:minecraft:1.21.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.20.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:4.9.3"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.6"
}
def cpOut = file("${rootDir}/../out/cp")
tasks.register('dumpClasspath') {
    doLast {
        cpOut.mkdirs()
        sourceSets.main.compileClasspath.files.findAll { it.isFile() && it.name.endsWith('.jar') }.each { f -> copy { from f; into cpOut } }
    }
}
