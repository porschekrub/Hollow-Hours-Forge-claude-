plugins {
    id 'fabric-loom' version '1.11.8'
}
repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}
dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.20.1"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1"
    modImplementation "software.bernie.geckolib:geckolib-fabric-1.20.1:4.8.4"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.3"
}
def cpOut = file("${rootDir}/../out/cp")
tasks.register('dumpClasspath') {
    doLast {
        cpOut.mkdirs()
        sourceSets.main.compileClasspath.files.findAll { it.isFile() && it.name.endsWith('.jar') }.each { f -> copy { from f; into cpOut } }
    }
}
