name: Export Fabric classpaths
# push the branch "export-classpath-fabric": sets up minimal Fabric (Loom) projects for 1.20.1 and 1.21.1 with
# Fabric API, GeckoLib and Forge Config API Port, and publishes every jar they compile against on "ci-classpath-fabric-<mc>".
on:
  push:
    branches: [export-classpath-fabric]
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        mc: [ "1.20.1", "1.21.1" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Versions
        run: |
          MC=${{ matrix.mc }}
          meta() { curl -s "$1" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g'; }
          LOOM=$(meta https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml | grep -v -- "-" | grep "^1\.11\." | sort -V | tail -1)
          # Loom 1.11 still runs on Java 21 (newer ones want Java 25)
          GRADLE=8.14.3
          echo "GRADLE=$GRADLE" >> $GITHUB_ENV
          LOADER=$(meta https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml | grep -v "beta\|alpha\|rc\|pre" | sort -V | tail -1)
          FAPI=$(meta https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep "+$MC\$" | sort -V | tail -1)
          GECKO=$(meta https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-fabric-$MC/maven-metadata.xml | sort -V | tail -1)
          FCAP=$(meta https://raw.githubusercontent.com/Fuzss/modresources/main/maven/fuzs/forgeconfigapiport/forgeconfigapiport-fabric/maven-metadata.xml | sort -V | tr '\n' ' ')
          echo "mc=$MC gradle=$GRADLE loom=$LOOM loader=$LOADER fabric-api=$FAPI geckolib=$GECKO" | tee versions.txt
          echo "fcap: $FCAP" | tee -a versions.txt
          echo "LOOM=$LOOM" >> $GITHUB_ENV; echo "LOADER=$LOADER" >> $GITHUB_ENV; echo "FAPI=$FAPI" >> $GITHUB_ENV; echo "GECKO=$GECKO" >> $GITHUB_ENV
          # Forge Config API Port: 8.x for 1.20.1, 21.1.x for 1.21.1
          case $MC in 1.20.1) F=$(echo $FCAP | tr ' ' '\n' | grep "^8\." | sort -V | tail -1);; *) F=$(echo $FCAP | tr ' ' '\n' | grep "^21\.1\." | sort -V | tail -1);; esac
          echo "FCAPV=$F" >> $GITHUB_ENV; echo "fcap chosen: $F" | tee -a versions.txt
      - name: Project
        run: |
          mkdir -p fab/src/main/java && cd fab
          cp -r ../ports/neoforge-1.21.1/hollow-hours/gradle . && cp ../ports/neoforge-1.21.1/hollow-hours/gradlew . && chmod +x gradlew
          sed -i "s#distributionUrl=.*#distributionUrl=https\\\\://services.gradle.org/distributions/gradle-$GRADLE-bin.zip#" gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          cat > settings.gradle <<EOF
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'fab'
          EOF
          cat > build.gradle <<EOF
          plugins {
              id 'fabric-loom' version '$LOOM'
          }
          repositories {
              maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
              maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
          }
          dependencies {
              minecraft "com.mojang:minecraft:${{ matrix.mc }}"
              mappings loom.officialMojangMappings()
              modImplementation "net.fabricmc:fabric-loader:$LOADER"
              modImplementation "net.fabricmc.fabric-api:fabric-api:$FAPI"
              modImplementation "software.bernie.geckolib:geckolib-fabric-${{ matrix.mc }}:$GECKO"
              modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$FCAPV"
          }
          def cpOut = file("\${rootDir}/../out/cp")
          tasks.register('exportClasspath') {
              doLast {
                  cpOut.mkdirs()
                  sourceSets.main.compileClasspath.files.findAll { it.isFile() && it.name.endsWith('.jar') }.each { f -> copy { from f; into cpOut } }
              }
          }
          EOF
          sed -i 's/^          //' settings.gradle build.gradle
          printf "org.gradle.jvmargs=-Xmx3G\norg.gradle.configuration-cache=false\n" > gradle.properties
          mkdir -p ../out && cp ../versions.txt ../out/
          ./gradlew exportClasspath --no-daemon 2>&1 | tail -30
          ls ../out/cp | wc -l; du -sh ../out/cp
          cp build.gradle settings.gradle ../out/
      - name: Publish
        if: always()
        run: |
          cd out
          git init -q && git checkout -q -b ci-classpath-fabric-${{ matrix.mc }} && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "classpath"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-classpath-fabric-${{ matrix.mc }}
