name: Film the promo
# push the branch "promo" to film the update in portrait (frames every 2 ticks); the frames go to "promo-out"
on:
  push:
    branches: [promo]
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: hollow-hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon -q
      - name: Make the world
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run/server.properties
          export HOLLOW_SMOKETEST=true
          timeout 1500 ./gradlew runServer --no-daemon > smoke.log 2>&1 || true
      - name: Film
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          pip install --quiet --break-system-packages pillow || true
          rm -rf run/saves/smoke && mkdir -p run/saves && cp -r run/world run/saves/smoke && rm -f run/saves/smoke/session.lock
          printf "onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:8\nsimulationDistance:6\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\nnarrator:0\nguiScale:3\nfov:0.0\n" > run/options.txt
          sed -i 's/earlyWindowControl *= *true/earlyWindowControl = false/' run/config/fml.toml || true
          export HOLLOW_CLIENTSMOKE=true HOLLOW_PROMO=true MC_WIDTH=720 MC_HEIGHT=1280 LIBGL_ALWAYS_SOFTWARE=1
          timeout 2700 xvfb-run -a -s "-screen 0 800x1400x24" ./gradlew runClient --no-daemon > client.log 2>&1 || true
          cp run/logs/latest.log client-latest.log || true
          grep -a "client smoke\|ERROR" client-latest.log | tail -40 || true
      - name: Publish the frames to "promo-out"
        if: always()
        working-directory: .
        run: |
          set +e
          D=/tmp/promo-out
          mkdir -p $D
          python3 - <<'PY'
          import os
          from PIL import Image
          src = 'hollow-hours/run/screenshots'; dst = '/tmp/promo-out'
          n = 0
          for name in sorted(os.listdir(src)) if os.path.isdir(src) else []:
              if name.startswith('promo_') and name.endswith('.png'):
                  Image.open(os.path.join(src, name)).convert('RGB').save(os.path.join(dst, name[:-4] + '.jpg'), quality=88)
                  n += 1
          print('frames', n)
          PY
          cp hollow-hours/client-latest.log $D/ 2>/dev/null
          cd $D
          git init -q
          git checkout -q -b promo-out
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "promo frames"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" promo-out
