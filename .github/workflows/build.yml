name: Build mods

# Builds both mods on every push, for every loader and Minecraft version (Forge 1.20.1 here; the rest from ports/),
# with server and client smoke tests. Push a tag like "v2.0.0" (or a branch release/2.0.0) to publish a GitHub Release.
on:
  push:
    branches: [ "**", "!export-classpath", "!gen-voice", "!voice-out", "!promo", "!promo-out", "!neoforge-test", "!neoforge-out", "!export-classpath-121", "!export-classpath-fabric", "!forge-loot-check", "!ci-classpath-*", "!ports-logs-*" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        project: [ hollow-hours, helper-buddy ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          # GitHub sometimes fails to hand out the Gradle download (504): try again a little later
          for try in 1 2 3 4; do
            ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log && break
            grep -q "Server returned HTTP response code: 5\|Connection reset\|Read timed out\|timeout (\|Could not GET\|Could not HEAD\|Failed to provision\|sha256 Invalid\|Could not resolve" build.log && [ $try -lt 4 ] || exit 1
            echo "download failed, trying again"; sleep 45
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-jar
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-slim.jar
          if-no-files-found: error

      - name: Server smoke test (the mod must load without crashing)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run/server.properties
          export HOLLOW_SMOKETEST=true HELPER_SMOKETEST=true
          timeout 1500 ./gradlew runServer --no-daemon > smoke.log 2>&1 || true
          echo "----- tail of server log -----"
          tail -n 120 run/logs/latest.log || true
          python3 ../tools/check_log.py run/logs/latest.log

      - name: Client smoke test (virtual display, screenshots of every ghost / jumpscare / kill)
        run: |
          cp run/logs/latest.log server-latest.log || true
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          pip install --quiet --break-system-packages pillow || true
          rm -rf run/saves/smoke && mkdir -p run/saves && cp -r run/world run/saves/smoke && rm -f run/saves/smoke/session.lock
          printf "onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:6\nsimulationDistance:6\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\nnarrator:0\nguiScale:2\n" > run/options.txt
          sed -i 's/earlyWindowControl *= *true/earlyWindowControl = false/' run/config/fml.toml || true
          export HOLLOW_CLIENTSMOKE=true HELPER_CLIENTSMOKE=true LIBGL_ALWAYS_SOFTWARE=1
          timeout 2400 xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew runClient --no-daemon > client.log 2>&1 || true
          cp run/logs/latest.log client-latest.log || true
          tail -n 60 client-latest.log || true
          python3 ../tools/check_log.py client-latest.log "CLIENT SMOKE OK"

      - name: Publish logs to the ci-logs branch (readable without downloading artifacts)
        if: always() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          set +e
          P=${{ matrix.project }}
          D=/tmp/ci-logs/$P
          mkdir -p $D
          cp $P/build.log $D/ 2>/dev/null
          cp $P/smoke.log $D/ 2>/dev/null
          cp $P/run/logs/latest.log $D/server.log 2>/dev/null
          cp $P/server-latest.log $D/server.log 2>/dev/null
          cp $P/client.log $P/client-latest.log $D/ 2>/dev/null
          cp -r $P/run/crash-reports $D/ 2>/dev/null
          python3 tools/shots.py $P/run/screenshots $D/screenshots
          echo "${{ github.sha }} ${{ job.status }}" > $D/STATUS
          cd $D
          git init -q
          git checkout -q -b ci-logs-$P
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "logs for ${{ github.sha }}"
          # two runs of the same commit (main + release) can race here: retry, and never fail the build over logs
          for i in 1 2 3; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-$P && break
            sleep $((i * 10))
          done
          exit 0

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-logs
          path: |
            ${{ matrix.project }}/run/logs/
            ${{ matrix.project }}/run/crash-reports/
          if-no-files-found: ignore

  port:
    name: ${{ matrix.target }} ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: neoforge-1.21.1, project: hollow-hours }
          - { target: neoforge-1.21.1, project: helper-buddy }
          - { target: forge-1.21.1, project: hollow-hours }
          - { target: forge-1.21.1, project: helper-buddy }
          - { target: fabric-1.20.1, project: helper-buddy }
          - { target: fabric-1.21.1, project: helper-buddy }
          - { target: fabric-1.20.1, project: hollow-hours }
          - { target: fabric-1.21.1, project: hollow-hours }
    defaults:
      run:
        working-directory: ports/${{ matrix.target }}/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 for the 1.20.1 Fabric toolchain, 21 (the default) for everything else
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          # GitHub sometimes fails to hand out the Gradle download (504): try again a little later
          for try in 1 2 3 4; do
            ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log && break
            grep -q "Server returned HTTP response code: 5\|Connection reset\|Read timed out\|timeout (\|Could not GET\|Could not HEAD\|Failed to provision\|sha256 Invalid\|Could not resolve" build.log && [ $try -lt 4 ] || exit 1
            echo "download failed, trying again"; sleep 45
          done
          ls -la build/libs
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.project }}-jar
          path: ports/${{ matrix.target }}/${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
      - name: Server smoke test
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run/server.properties
          export HOLLOW_SMOKETEST=true HELPER_SMOKETEST=true
          timeout 1500 ./gradlew runServer --no-daemon > smoke.log 2>&1 || true
          tail -n 80 run/logs/latest.log || tail -n 80 smoke.log
          python3 ../../../tools/check_log.py run/logs/latest.log
      - name: Client smoke test (virtual display)
        if: always()
        run: |
          cp run/logs/latest.log server-latest.log || true
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          pip install --quiet --break-system-packages pillow || true
          rm -rf run/saves/smoke && mkdir -p run/saves && cp -r run/world run/saves/smoke && rm -f run/saves/smoke/session.lock
          printf "onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:6\nsimulationDistance:6\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\nnarrator:0\nguiScale:2\n" > run/options.txt
          mkdir -p run/config && printf "earlyWindowControl = false\n" > run/config/fml.toml
          export HOLLOW_CLIENTSMOKE=true HELPER_CLIENTSMOKE=true LIBGL_ALWAYS_SOFTWARE=1
          for try in 1 2 3; do
            rm -f run/logs/latest.log
            timeout 2400 xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew runClient --no-daemon > client.log 2>&1 || true
            # a download of the game's assets that failed (Mojang's servers): again, a little later
            grep -q "HttpTimeoutException\|SocketTimeoutException\|Connection reset\|Failed to download" client.log && [ ! -f run/logs/latest.log ] || break
            echo "download failed, trying again"; sleep 30
          done
          cp run/logs/latest.log client-latest.log || true
          tail -n 60 client-latest.log || tail -n 80 client.log
          python3 ../../../tools/check_log.py client-latest.log "CLIENT SMOKE OK"
      - name: Client smoke test on a real install of the loader (portablemc, the built jar)
        if: always() && matrix.target != 'neoforge-1.21.1'
        run: |
          curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/theorzr/portablemc/releases/latest > pmc-release.json
          U=$(python3 -c "
          import json; a=json.load(open('pmc-release.json')).get('assets', [])
          ok=[x['browser_download_url'] for x in a if 'linux' in x['name'].lower() and 'x86_64' in x['name'] and x['name'].endswith('.tar.gz')]
          print(ok[0] if ok else '')")
          mkdir -p pmc && for try in 1 2 3 4; do curl -sL "$U" | tar xz -C pmc && break; echo "portablemc download failed, trying again"; sleep 20; done
          PMC=$(find $PWD/pmc -type f -name portablemc | head -1); chmod +x $PMC
          M=$PWD/mc; rm -rf $M; mkdir -p $M/mods $M/saves $M/config
          cp build/libs/*.jar $M/mods/
          rm -f $M/mods/*-sources.jar
          case "${{ matrix.target }}" in
            # Forge 1.21 loses its loot modifiers with quick play: the test opens the world from the title screen
            forge-1.21.1) VER=forge:1.21.1; JOIN=""; MENU=",-Dhollowhours.menuload=true,-Dhelperbuddy.menuload=true";;
            fabric-*)
              MC=${{ matrix.target }}; MC=${MC#fabric-}
              FAPI=$(grep '^fabric_api_version=' gradle.properties | cut -d= -f2)
              curl -sfL -o $M/mods/fabric-api-$FAPI.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$FAPI/fabric-api-$FAPI.jar"
              VER=fabric:$MC; JOIN="--join-world smoke"; MENU="";;
          esac
          ls $M/mods
          cp -r run/world $M/saves/smoke && rm -f $M/saves/smoke/session.lock
          cp run/options.txt $M/options.txt
          printf "earlyWindowControl = false\n" > $M/config/fml.toml
          export LIBGL_ALWAYS_SOFTWARE=1
          for try in 1 2 3; do
            rm -f $M/logs/latest.log
            timeout 2400 xvfb-run -a -s "-screen 0 1280x800x24" $PMC --main-dir $PWD/pmc-main start --mc-dir $M $VER -u Dev $JOIN --resolution 960x540 \
                --jvm-arg=-Dhollowhours.clientsmoke=true,-Dhelperbuddy.clientsmoke=true$MENU,-Xmx3G > prod-client.log 2>&1 || true
            [ -f $M/logs/latest.log ] && break
            echo "the game did not start (downloads?), trying again"; sleep 30
          done
          grep -a "Loading version\|forge\|fabric" prod-client.log | head -5
          cp $M/logs/latest.log prod-client-latest.log || true
          mkdir -p run/screenshots-prod && cp -r $M/screenshots/* run/screenshots-prod/ 2>/dev/null || true
          tail -n 40 prod-client-latest.log || tail -n 60 prod-client.log
          python3 ../../../tools/check_log.py prod-client-latest.log "CLIENT SMOKE OK"
      - name: Publish logs
        if: always() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          set +e
          P=ports/${{ matrix.target }}/${{ matrix.project }}
          D=/tmp/ports-logs
          mkdir -p $D
          cp $P/build.log $P/smoke.log $P/client.log $P/client-latest.log $P/server-latest.log $P/prod-client.log $P/prod-client-latest.log $D/ 2>/dev/null
          python3 tools/shots.py $P/run/screenshots-prod $D/screenshots-prod
          cp $P/run/logs/latest.log $D/server.log 2>/dev/null
          cp -r $P/run/crash-reports $D/ 2>/dev/null
          python3 tools/shots.py $P/run/screenshots $D/screenshots
          echo "${{ github.sha }} ${{ job.status }}" > $D/STATUS
          cd $D && git init -q && git checkout -q -b ports-logs-${{ matrix.target }}-${{ matrix.project }} && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "logs for ${{ github.sha }}"
          for i in 1 2 3; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ports-logs-${{ matrix.target }}-${{ matrix.project }} && break
            sleep $((i * 10))
          done
          exit 0

  release:
    name: Publish release
    # only when both mods built and passed every test
    # a tag "v2.0.0" or a branch "release/2.0.0" publishes the release
    if: needs.build.result == 'success' && needs.port.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/'))
    needs: [ build, port ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-jar"
          merge-multiple: true

      - name: Release name
        id: tag
        run: |
          T="${GITHUB_REF_NAME#release/}"
          case "$T" in v*) ;; *) T="v$T" ;; esac
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hollow Hours + Helper Buddy ${{ steps.tag.outputs.tag }} (Forge / NeoForge / Fabric, 1.20.1 + 1.21.1)
          body_path: .github/release-notes.md
          files: dist/*.jar
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
