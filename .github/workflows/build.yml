name: Build mods

# Builds both mods on every push. Push a tag like "v2.0.0" to also publish a GitHub Release with the jars.
on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        project: [ hollow-hours, helper-buddy ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Server smoke test (the mod must load without crashing)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run/server.properties
          export HOLLOW_SMOKETEST=true HELPER_SMOKETEST=true
          timeout 1500 ./gradlew runServer --no-daemon > smoke.log 2>&1 || true
          echo "----- tail of server log -----"
          tail -n 120 run/logs/latest.log || true
          python3 ../tools/check_log.py run/logs/latest.log

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-jar
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-slim.jar
          if-no-files-found: error

      - name: Publish logs to the ci-logs branch (readable without downloading artifacts)
        if: always() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          set +e
          P=${{ matrix.project }}
          D=/tmp/ci-logs/$P
          mkdir -p $D
          cp $P/build.log $D/ 2>/dev/null
          cp $P/smoke.log $D/ 2>/dev/null
          cp $P/run/logs/latest.log $D/server.log 2>/dev/null
          cp -r $P/run/crash-reports $D/ 2>/dev/null
          cp -r $P/run/screenshots $D/ 2>/dev/null
          echo "${{ github.sha }} ${{ job.status }}" > $D/STATUS
          cd $D
          git init -q
          git checkout -q -b ci-logs-$P
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "logs for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-$P

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-logs
          path: |
            ${{ matrix.project }}/run/logs/
            ${{ matrix.project }}/run/crash-reports/
          if-no-files-found: ignore

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-jar"
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
