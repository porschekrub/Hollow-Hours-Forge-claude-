name: Build mods

# Builds both mods on every push. Push a tag like "v2.0.0" to also publish a GitHub Release with the jars.
on:
  push:
    branches: [ "**", "!export-classpath" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        project: [ hollow-hours, helper-buddy ]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-jar
          path: |
            ${{ matrix.project }}/build/libs/*.jar
            !${{ matrix.project }}/build/libs/*-slim.jar
          if-no-files-found: error

      - name: Server smoke test (the mod must load without crashing)
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n" > run/server.properties
          export HOLLOW_SMOKETEST=true HELPER_SMOKETEST=true
          timeout 1500 ./gradlew runServer --no-daemon > smoke.log 2>&1 || true
          echo "----- tail of server log -----"
          tail -n 120 run/logs/latest.log || true
          python3 ../tools/check_log.py run/logs/latest.log

      - name: Client smoke test (virtual display, screenshots of every ghost / jumpscare / kill)
        run: |
          cp run/logs/latest.log server-latest.log || true
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          pip install --quiet --break-system-packages pillow || true
          rm -rf run/saves/smoke && mkdir -p run/saves && cp -r run/world run/saves/smoke && rm -f run/saves/smoke/session.lock
          printf "onboardAccessibility:false\npauseOnLostFocus:false\nrenderDistance:6\nsimulationDistance:6\ntutorialStep:none\njoinedFirstServer:true\nskipMultiplayerWarning:true\nnarrator:0\nguiScale:2\n" > run/options.txt
          sed -i 's/earlyWindowControl *= *true/earlyWindowControl = false/' run/config/fml.toml || true
          export HOLLOW_CLIENTSMOKE=true HELPER_CLIENTSMOKE=true LIBGL_ALWAYS_SOFTWARE=1
          timeout 2400 xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew runClient --no-daemon > client.log 2>&1 || true
          cp run/logs/latest.log client-latest.log || true
          tail -n 60 client-latest.log || true
          python3 ../tools/check_log.py client-latest.log "CLIENT SMOKE OK"

      - name: Publish logs to the ci-logs branch (readable without downloading artifacts)
        if: always() && github.event_name != 'pull_request'
        working-directory: .
        run: |
          set +e
          P=${{ matrix.project }}
          D=/tmp/ci-logs/$P
          mkdir -p $D
          cp $P/build.log $D/ 2>/dev/null
          cp $P/smoke.log $D/ 2>/dev/null
          cp $P/run/logs/latest.log $D/server.log 2>/dev/null
          cp $P/server-latest.log $D/server.log 2>/dev/null
          cp $P/client.log $P/client-latest.log $D/ 2>/dev/null
          cp -r $P/run/crash-reports $D/ 2>/dev/null
          python3 tools/shots.py $P/run/screenshots $D/screenshots
          echo "${{ github.sha }} ${{ job.status }}" > $D/STATUS
          cd $D
          git init -q
          git checkout -q -b ci-logs-$P
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "logs for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-$P

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-logs
          path: |
            ${{ matrix.project }}/run/logs/
            ${{ matrix.project }}/run/crash-reports/
          if-no-files-found: ignore

  release:
    name: Publish release
    # runs even when one mod failed, so a finished mod can be released while the other is still being worked on
    # a tag "v2.0.0" or a branch "release/2.0.0" publishes the release
    if: always() && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-jar"
          merge-multiple: true

      - name: Release name
        id: tag
        run: |
          T="${GITHUB_REF_NAME#release/}"
          case "$T" in v*) ;; *) T="v$T" ;; esac
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hollow Hours + Helper Buddy ${{ steps.tag.outputs.tag }} (Forge 1.20.1)
          body_path: .github/release-notes.md
          files: dist/*.jar
          fail_on_unmatched_files: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
