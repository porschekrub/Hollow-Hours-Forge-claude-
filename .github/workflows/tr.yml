name: Transcribe
on:
  push:
    branches: [transcribe]
jobs:
  tr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q faster-whisper
      - run: mkdir -p out && python tr.py 2>&1 | tee out/log.txt
      - run: |
          cd out && git init -q && git checkout -q -b transcribe-out && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" transcribe-out
