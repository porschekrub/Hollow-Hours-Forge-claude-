name: Export compile classpath

# Push the branch "export-classpath" to publish every jar the mods compile against (deobfuscated Minecraft + Forge,
# GeckoLib, libraries) on the branch "ci-classpath", so code can be compiled quickly outside Gradle.
on:
  push:
    branches: [ "export-classpath" ]

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Export
        working-directory: hollow-hours
        run: |
          chmod +x gradlew
          # hollow-hours always compiles; its classpath is the same Forge + GeckoLib set
          cat >> build.gradle <<'GRADLE'

          tasks.register('exportClasspath') {
              doLast {
                  def out = file("${buildDir}/cp")
                  delete out
                  out.mkdirs()
                  sourceSets.main.compileClasspath.files.findAll { it.isFile() && it.name.endsWith('.jar') }.each { f -> copy { from f; into out } }
              }
          }
          GRADLE
          ./gradlew exportClasspath --no-daemon
          ls -la build/cp | head -100
          du -sh build/cp

      - name: Publish
        working-directory: hollow-hours/build/cp
        run: |
          git init -q
          git checkout -q -b ci-classpath
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "compile classpath for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-classpath
